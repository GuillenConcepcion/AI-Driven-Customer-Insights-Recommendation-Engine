version: '3.8'

services:
  api:
    build: .
    container_name: customer-insights-api
    command: uvicorn customer_insights.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped

  dashboard:
    build: .
    container_name: customer-insights-dashboard
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./app:/app/app
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app/src
    depends_on:
      - api
    restart: unless-stopped
