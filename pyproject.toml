[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-insights"
version = "0.1.0"
description = "AI-Driven Customer Insights, RFM Clustering & Recommendation Engine based on RecSysDatasets / Amazon Reviews benchmark."
readme = "README.md"
authors = [
    { name = "Guillen Concepción", email = "guillenconcepcion@gmail.com" }
]

[project.urls]
Homepage = "https://github.com/GuillenConcepcion/AI-Driven-Customer-Insights-Recommendation-Engine"
Repository = "https://github.com/GuillenConcepcion/AI-Driven-Customer-Insights-Recommendation-Engine"

requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]
